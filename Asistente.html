<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Glidia Assistente</title>

    <link rel="stylesheet" href="Asistente.css">

</head>


<body>


    <!-- BOTÃO ALTERAR TEMA -->

    <button 
        class="theme" 
        onclick="tema()"
        aria-label="Alterar tema">
        🌙
    </button>




    <div class="container">



        <!-- LOGO -->

        <h1 class="logo">

            Glidia

        </h1>





        <!-- ÁREA DO ASSISTENTE -->


        <div class="voice">


            <div 
                class="circle" 
                onclick="botaoBengala()"
                role="button"
                aria-label="Ativar Glidia">


                <div class="wave">

                    🎙️

                </div>


            </div>


        </div>







        <!-- STATUS -->


        <p id="status">

            Clique no círculo para conversar

        </p>







        <!-- CARDS -->


        <div class="cards">



            <div class="card">


                <div class="icon">

                    📍

                </div>


                <h2>

                    GPS Inteligente

                </h2>


                <p>

                    Localização em tempo real e rotas acessíveis.

                </p>


            </div>







            <div class="card">


                <div class="icon">

                    🔔

                </div>


                <h2>

                    Lembretes

                </h2>


                <p>

                    Alertas para compromissos e medicamentos.

                </p>


            </div>







            <div class="card">


                <div class="icon">

                    🚖

                </div>


                <h2>

                    Uber Integrado

                </h2>


                <p>

                    Solicite corridas com rapidez e autonomia.

                </p>


            </div>



        </div>







        <!-- CONVERSA -->


        <div id="conversa">

        </div>





    </div>








<script>


function tema(){


    document.body.classList.toggle("dark");


    const botao = document.querySelector(".theme");


    if(document.body.classList.contains("dark")){

        botao.innerHTML="☀️";

    }else{

        botao.innerHTML="🌙";

    }


}


</script>





<script src="./voz_frontend.js"></script>


</body>

</html>
